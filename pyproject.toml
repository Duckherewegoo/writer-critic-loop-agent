[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "writer-critic-loop-agent"
version = "0.2.1"
description = "基于 LangGraph 的 Writer–Critic 反思式写作工作流（研究/写作/审核/编辑四角色）"
keywords = ["langgraph", "writer-critic", "reflection", "gradio", "writing", "llm"]
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "DakeGinger", email = "dakeginger@qq.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langchain>=1.3.0",
    "langgraph>=1.2.0",
    "langchain-openai>=1.3.0",
    "gradio>=6.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",  # 新增：用于生成测试覆盖率报告
]

[project.scripts]
# 需先 pip install -e ".[dev]"，然后可直接 `writer-app` 启动
writer-app = "main:main"

[project.urls]
Repository = "https://github.com/DakeGinger/langgraph-multi-agent.git"
Issues = "https://github.com/DakeGinger/langgraph-multi-agent/issues"

# 平铺结构：main.py 是顶层模块，三个目录是包
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "graph*", "utils*"]

# ==========================
# 工具链配置
# ==========================

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "E501",    # 行长度交由 ruff format 处理
    "EXE002",  # 忽略“文件有执行权限但没 shebang”的警告
    "RUF001",  # 字符串中有歧义字符（中文全角）
    "RUF002",  # 文档字符串中有歧义字符
    "RUF003",  # 注释中有歧义字符
]

[tool.ruff.lint.per-file-ignores]
# 测试脚本允许捕获宽泛异常
"test.py" = ["BLE001"]
"tests/**" = ["BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# ── 基础路径与文件收集 ──
testpaths = ["tests"]
# 显式加上 smoke_test.py，否则 pytest 默认只认 test_*.py，会漏掉你的冒烟测试
python_files = ["test_*.py", "*_test.py", "smoke_test.py"]

# ── 异步配置 (适配 pytest-asyncio 1.x) ──
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

# ── 标记 (Markers) ──
markers = [
    "network: marks tests that require real LLM API access (deselect with '-m \"not network\"')",
]

# ── 警告过滤 ──
filterwarnings = [
    # 忽略第三方库的弃用警告，保持输出干净
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ── 默认命令行参数 ──
# -v 详细输出，-W ignore 忽略多余警告，--strict-markers 防止拼错 marker
addopts = "-v --strict-markers"

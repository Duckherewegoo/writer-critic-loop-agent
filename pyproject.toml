[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "writer-critic-loop-agent"
version = "0.2.0"
description = "基于 LangGraph 的 Writer–Critic 反思式写作工作流（研究/写作/审核/编辑四角色）"
keywords = ["langgraph", "writer-critic", "reflection", "gradio", "writing", "llm"]
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "DakeGinger", email = "dakeginger@qq.com" }
]
keywords = ["langgraph", "multi-agent", "gradio", "llm", "writing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langchain>=1.3.0",
    "langgraph>=1.2.0",
    "langchain-openai>=1.3.0",
    "gradio>=6.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
# 需先 pip install -e ".[dev]"，然后可直接 `writer-app` 启动
writer-app = "main:main"

[project.urls]
Repository = "https://github.com/DakeGinger/langgraph-multi-agent.git"
Issues = "https://github.com/DakeGinger/langgraph-multi-agent/issues"

# 平铺结构：main.py 是顶层模块，三个目录是包
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "graph*", "utils*"]

# ==========================
# 工具链配置
# ==========================

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "E501",    # 行长度交由 ruff format 处理
    "EXE002",  # 忽略“文件有执行权限但没 shebang”的警告
    "RUF001",  # 字符串中有歧义字符（中文全角）
    "RUF002",  # 文档字符串中有歧义字符
    "RUF003",  # 注释中有歧义字符
]

[tool.ruff.lint.per-file-ignores]
# 测试脚本允许捕获宽泛异常
"test.py" = ["BLE001"]
"tests/**" = ["BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
